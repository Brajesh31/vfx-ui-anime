<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX UI Anime Alert</title><style>body{font:16px system-ui;margin:0;padding:40px;background:#f7f6ff;color:#1d1a4a}main{max-width:680px;margin:auto;background:white;padding:28px;border:2px solid #1d1a4a;border-radius:18px;box-shadow:8px 9px 0 #b8b3ff}p{color:#656080}</style><main><h1>Alert</h1><p>Dismissible semantic status banner</p><vfx-alert tone="success" dismissible>Changes saved successfully.</vfx-alert><p id="state" aria-live="polite">Try the component.</p></main><script src="index.js"></script><script>document.querySelector('vfx-alert').addEventListener('change',e=>document.querySelector('#state').textContent=JSON.stringify(e.detail));document.querySelector('vfx-alert').addEventListener('complete',e=>document.querySelector('#state').textContent='Complete: '+e.detail.value)</script></html>
