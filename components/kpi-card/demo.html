<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI Card Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,760px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.stage{display:grid;place-items:center;padding:25px}button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#f0edff;font:inherit;font-weight:700;cursor:pointer}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>🎯 KPI Card</h1><p>A dashboard summary card with a primary metric and explicit trend context.</p>
<div class="stage"><vfx-kpi-card id="kpi" label="Monthly revenue" value="₹2,48,000" delta="+8.4%"></vfx-kpi-card></div>
<button id="update" type="button">Show decline scenario</button><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>const kpi=document.querySelector('#kpi');document.querySelector('#update').addEventListener('click',()=>{kpi.label='Monthly revenue';kpi.value='₹2,21,500';kpi.delta='-3.2%';kpi.setAttribute('trend','negative');});</script></body></html>
