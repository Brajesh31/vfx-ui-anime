<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Particle Field | VFX UI Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.55 system-ui,sans-serif}
    main{width:min(100%,780px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}
    h1{margin:0;font-size:clamp(24px,4vw,34px)}p{color:#686381}vfx-particle-field{margin:22px auto}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
    label{display:grid;gap:5px;font-weight:750;font-size:13px}input,button{font:inherit}
    button{padding:8px 12px;border:2px solid #1d1a4a;border-radius:8px;background:#ffcae4;color:#1d1a4a;font-weight:800;cursor:pointer}
    a{color:#5146bd;font-weight:700}
  </style>
  <script src="index.js"></script>
</head>
<body>
  <main>
    <h1>✨ Particle Field</h1>
    <p>A decorative canvas field. Adjust its density, drift speed, and color. The animation freezes when reduced motion is enabled in your operating system or browser.</p>
    <vfx-particle-field id="field" count="48" speed="1" color="#e0d7ff"></vfx-particle-field>
    <div class="controls">
      <label>Particle count <output id="count-value">48</output><input id="count" type="range" min="8" max="160" value="48"></label>
      <label>Drift speed <output id="speed-value">1.0×</output><input id="speed" type="range" min="0" max="3" step=".1" value="1"></label>
      <label>Particle color <input id="color" type="color" value="#e0d7ff"></label>
      <button id="pause" type="button">Pause field</button>
    </div>
    <p id="status" role="status" aria-live="polite">Animation running.</p>
    <a href="../../gallery/">← Back to the component gallery</a>
  </main>
  <script>
    const field = document.querySelector('#field');
    const count = document.querySelector('#count');
    const speed = document.querySelector('#speed');
    const color = document.querySelector('#color');
    const pause = document.querySelector('#pause');
    const status = document.querySelector('#status');
    count.addEventListener('input', () => {
      field.count = Number(count.value);
      document.querySelector('#count-value').textContent = count.value;
    });
    speed.addEventListener('input', () => {
      field.speed = Number(speed.value);
      document.querySelector('#speed-value').textContent = Number(speed.value).toFixed(1) + '×';
    });
    color.addEventListener('input', () => { field.color = color.value; });
    pause.addEventListener('click', () => {
      field.paused = !field.paused;
      pause.textContent = field.paused ? 'Resume field' : 'Pause field';
      status.textContent = field.paused ? 'Animation paused.' : 'Animation running.';
    });
  </script>
</body>
</html>
