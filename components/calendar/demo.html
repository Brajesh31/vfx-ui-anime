<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Calendar</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(700px,100%)}.stage{display:flex;justify-content:center;padding:25px;border:1px solid #dcdaf0;border-radius:18px}#state{min-height:1.5em;color:#8580b0}</style><main><h1>Calendar</h1><p>Month navigation with page-turn slashes, date impact effects and keyboard movement.</p><section class="stage"><vfx-calendar></vfx-calendar></section><p id="state" aria-live="polite">Choose a date.</p><a href="../../gallery/">← Back to gallery</a></main><script src="index.js"></script><script>document.querySelector('vfx-calendar').addEventListener('change',e=>document.querySelector('#state').textContent=e.detail.value||'Selection cleared');</script></html>
