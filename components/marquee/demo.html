<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marquee | VFX UI Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.55 system-ui,sans-serif}
    main{width:min(100%,820px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}
    h1{margin:0;font-size:clamp(24px,4vw,34px)}p{color:#686381}
    vfx-marquee{margin:22px auto;padding:14px 0;border-block:1px solid #e6e1ff}
    .word{display:inline-block;padding:8px 16px;border:2px solid #1d1a4a;border-radius:99px;background:#f0edff}
    .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}
    label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:750}
    button{padding:8px 12px;border:2px solid #1d1a4a;border-radius:8px;background:#ffcae4;color:#1d1a4a;font:inherit;font-weight:800;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #6558d9;outline-offset:3px}a{color:#5146bd;font-weight:700}
  </style>
  <script src="index.js"></script>
</head>
<body>
  <main>
    <h1>📰 Marquee</h1>
    <p>Hover the strip or focus its link to pause the loop. The duplicate track is decorative and cannot receive keyboard focus.</p>
    <vfx-marquee id="ticker" label="Featured topics" duration="22">
      <span class="word">BUILD</span><span>✦</span><span class="word">CREATE</span><span>✦</span><span class="word">SHIP</span><span>✦</span>
      <a href="../../gallery/">EXPLORE THE GALLERY</a><span>✦</span>
    </vfx-marquee>
    <div class="controls">
      <label>Loop duration <output id="duration-value">22 seconds</output><input id="duration" type="range" min="4" max="60" value="22"></label>
      <button id="pause" type="button">Pause marquee</button>
    </div>
    <a href="../../gallery/">← Back to the component gallery</a>
  </main>
  <script>
    const ticker = document.querySelector('#ticker');
    const duration = document.querySelector('#duration');
    const pause = document.querySelector('#pause');
    duration.addEventListener('input', () => {
      ticker.duration = Number(duration.value);
      document.querySelector('#duration-value').textContent = duration.value + ' seconds';
    });
    pause.addEventListener('click', () => {
      ticker.paused = !ticker.paused;
      pause.textContent = ticker.paused ? 'Resume marquee' : 'Pause marquee';
    });
  </script>
</body>
</html>
