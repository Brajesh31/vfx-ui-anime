<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Badge</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%)}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:30px;border:1px solid #dcdaf0;border-radius:18px}button{margin-top:18px;padding:9px 14px;border:2px solid #1d1a4a;border-radius:10px;background:#fff;font-weight:700}</style><main><h1>Badge</h1><p>Compact status markers with spring reactions and live status changes.</p><section class="row"><vfx-badge status="success" pulse>Deployed</vfx-badge><vfx-badge status="warning">Review</vfx-badge><vfx-badge status="error">Failed</vfx-badge><vfx-badge status="info">In progress</vfx-badge><vfx-badge status="neutral">Draft</vfx-badge></section><button id="cycle">Cycle first badge status</button><p><a href="../../gallery/">← Back to gallery</a></p><script src="index.js"></script><script>const b=document.querySelector('vfx-badge');const states=['success','warning','error','info'];let i=0;document.querySelector('#cycle').onclick=()=>b.setAttribute('status',states[++i%states.length]);</script></main></html>
