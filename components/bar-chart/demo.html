<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bar Chart Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,820px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.stage{display:grid;place-items:center;padding:20px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#f0edff;font:inherit;font-weight:700;cursor:pointer}#result{min-height:1.5em;font-size:13px;color:#625b91}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>📊 Bar Chart</h1><p>Activate a bar with a pointer, Enter, or Space to inspect its value.</p>
<div class="stage"><vfx-bar-chart id="chart" title="Monthly signups" labels="Jan,Feb,Mar,Apr,May,Jun" values="18,32,24,48,38,64"></vfx-bar-chart></div>
<div class="actions"><button id="update" type="button">Load new data</button><button id="reset" type="button">Reset</button></div><p id="result" aria-live="polite">Select a bar to see its data.</p><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>const chart=document.querySelector('#chart'),result=document.querySelector('#result');chart.addEventListener('select',e=>{result.textContent=e.detail.label+': '+e.detail.value;});document.querySelector('#update').addEventListener('click',()=>{chart.labels=['Mon','Tue','Wed','Thu','Fri'];chart.values=[12,24,-4,32,27];result.textContent='Updated with a negative value.';});document.querySelector('#reset').addEventListener('click',()=>{chart.labels=['Jan','Feb','Mar','Apr','May','Jun'];chart.values=[18,32,24,48,38,64];result.textContent='Sample data restored.';});</script></body></html>
