<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFX UI Anime Gradient Picker</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.5 system-ui}main{width:min(100%,820px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}h1{margin:0 0 8px;font-size:clamp(23px,5vw,34px)}p{color:#7771a8}.stage{display:grid;place-items:center;padding:24px 8px}.hint{font-size:12px}
</style>
<script src="index.js"></script>
</head>
<body>
<main>
<h1>🌈 Gradient Picker</h1>
<p>Select a color stop, change its position, add intermediate stops and adjust the gradient direction. The CSS output updates as you edit.</p>
<div class="stage">
<vfx-gradient-picker id="gradient" name="background" stops='[{"id":"rose","color":"#ff5fa8","position":0},{"id":"violet","color":"#8f8df7","position":55},{"id":"mint","color":"#67d8c0","position":100}]' angle="135"></vfx-gradient-picker>
</div>
<p class="hint" id="result" aria-live="polite">The component supports two to eight hexadecimal color stops.</p>
<p><a href="../../gallery/">← Back to component gallery</a></p>
</main>
<script>
document.querySelector('#gradient').addEventListener('change',event=>{document.querySelector('#result').textContent=event.detail.value;});
</script>
</body>
</html>
