<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heatmap Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,820px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.stage{display:grid;place-items:center;padding:20px 0}#result{min-height:1.5em;color:#625b91;font-size:13px}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>🟪 Heatmap</h1><p>Choose any cell to inspect its label and intensity level.</p>
<div class="stage"><vfx-heatmap id="heat" title="Weekly study activity" columns="7" labels="Mon,Tue,Wed,Thu,Fri,Sat,Sun" values="1,2,4,3,2,0,1"></vfx-heatmap></div>
<p id="result" aria-live="polite">Select a day to view its activity level.</p><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>document.querySelector('#heat').addEventListener('select',e=>{document.querySelector('#result').textContent=e.detail.label+': level '+e.detail.level+' of 4';});</script></body></html>
