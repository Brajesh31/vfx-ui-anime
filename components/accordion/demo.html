<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX UI Anime Accordion</title><style>body{font:16px system-ui;margin:0;padding:40px;background:#f7f6ff;color:#1d1a4a}main{max-width:680px;margin:auto;background:white;padding:28px;border:2px solid #1d1a4a;border-radius:18px;box-shadow:8px 9px 0 #b8b3ff}p{color:#656080}</style><main><h1>Accordion</h1><p>Expandable disclosure sections</p><vfx-accordion><details open><summary>What is VFX UI Anime?</summary><p>Anime-inspired interface components.</p></details><details><summary>Is it dependency-free?</summary><p>Yes, standalone web components.</p></details></vfx-accordion><p id="state" aria-live="polite">Try the component.</p></main><script src="index.js"></script><script>document.querySelector('vfx-accordion').addEventListener('change',e=>document.querySelector('#state').textContent=JSON.stringify(e.detail));document.querySelector('vfx-accordion').addEventListener('complete',e=>document.querySelector('#state').textContent='Complete: '+e.detail.value)</script></html>
