<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut Chart Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,820px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.stage{display:grid;place-items:center;padding:20px 0}button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#f0edff;font:inherit;font-weight:700;cursor:pointer}#result{min-height:1.5em;font-size:13px;color:#625b91}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>🍩 Donut Chart</h1><p>Activate a slice or its legend row to inspect the category share.</p>
<div class="stage"><vfx-donut-chart id="chart" title="Traffic sources" labels="Direct,Search,Social,Other" values="45,30,15,10"></vfx-donut-chart></div>
<button id="update" type="button">Update proportions</button><p id="result" aria-live="polite">Choose a category to inspect it.</p><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>const chart=document.querySelector('#chart'),result=document.querySelector('#result');chart.addEventListener('select',e=>{result.textContent=e.detail.label+': '+e.detail.value+' ('+e.detail.percent.toFixed(1)+'%)';});document.querySelector('#update').addEventListener('click',()=>{chart.values=[60,20,15,5];result.textContent='New proportions loaded.';});</script></body></html>
