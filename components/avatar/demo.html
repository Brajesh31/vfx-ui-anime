<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Avatar</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%)}.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:34px;border:1px solid #dcdaf0;border-radius:18px}button{margin-top:20px;padding:9px 14px;border:2px solid #1d1a4a;border-radius:10px;background:#fff;font-weight:700}</style><main><h1>Avatar</h1><p>Portraits with initials fallback, size presets and presence states.</p><section class="row"><vfx-avatar name="Brajesh Kumar" status="online" size="xl"></vfx-avatar><vfx-avatar name="Mika Tanaka" status="busy" size="large"></vfx-avatar><vfx-avatar name="Ava Chen" status="away"></vfx-avatar><vfx-avatar name="Guest" size="small"></vfx-avatar></section><button id="cycle">Cycle presence</button><p><a href="../../gallery/">← Back to gallery</a></p><script src="index.js"></script><script>const a=document.querySelector('vfx-avatar');const states=['online','busy','away','offline'];let i=0;document.querySelector('#cycle').onclick=()=>a.setAttribute('status',states[++i%states.length]);</script></main></html>
