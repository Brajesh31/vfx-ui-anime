<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON Editor | VFX UI Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.55 system-ui,sans-serif}
    main{width:min(100%,900px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}
    h1{margin:0;font-size:clamp(24px,4vw,34px)}p{color:#686381}vfx-json-editor{margin:20px auto}
    a{color:#5146bd;font-weight:700}.hint{font-size:13px}
  </style>
  <script src="index.js"></script>
</head>
<body>
  <main>
    <h1>🧩 JSON Editor</h1>
    <p>Try changing the JSON source. The status reports validity and the preview updates only when parsing succeeds.</p>
    <vfx-json-editor id="editor" required></vfx-json-editor>
    <p class="hint">Use Format to pretty-print and Minify to compact valid JSON. Invalid source remains intact so it can be corrected.</p>
    <a href="../../gallery/">← Back to the component gallery</a>
  </main>
  <script>
    const editor = document.querySelector('#editor');
    editor.value = JSON.stringify({
      project: 'VFX UI Anime',
      release: 12,
      ready: true,
      components: ['video-player', 'markdown-editor', 'json-editor'],
      quality: { accessible: true, reducedMotion: true }
    }, null, 2);
  </script>
</body>
</html>
