<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animated Counter | VFX UI Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.55 system-ui,sans-serif}
    main{width:min(100%,700px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff;text-align:center}
    h1{margin:0;font-size:clamp(24px,4vw,34px)}p{color:#686381}
    vfx-animated-counter{display:block;margin:28px auto;padding:20px;border:2px solid #1d1a4a;border-radius:14px;background:#f0edff}
    .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
    button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#ffcae4;color:#1d1a4a;font:inherit;font-weight:800;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #6558d9;outline-offset:3px}a{color:#5146bd;font-weight:700}
  </style>
  <script src="index.js"></script>
</head>
<body>
  <main>
    <h1>🔢 Animated Counter</h1>
    <p>Update the target value, change the locale, and watch the display settle on its latest target.</p>
    <vfx-animated-counter id="counter" value="12500" label="Downloads" duration="900" locale="en-US"></vfx-animated-counter>
    <div class="controls">
      <button id="increase" type="button">Add 1,000</button>
      <button id="reset" type="button">Reset</button>
      <button id="locale" type="button">Use German formatting</button>
    </div>
    <p id="status" role="status" aria-live="polite">Counter ready.</p>
    <a href="../../gallery/">← Back to the component gallery</a>
  </main>
  <script>
    const counter = document.querySelector('#counter');
    let target = counter.value;
    document.querySelector('#increase').addEventListener('click', () => {
      target += 1000;
      counter.value = target;
    });
    document.querySelector('#reset').addEventListener('click', () => {
      target = 12500;
      counter.value = target;
    });
    document.querySelector('#locale').addEventListener('click', event => {
      const german = counter.locale !== 'de-DE';
      counter.locale = german ? 'de-DE' : 'en-US';
      event.currentTarget.textContent = german ? 'Use US formatting' : 'Use German formatting';
    });
    counter.addEventListener('complete', event => {
      document.querySelector('#status').textContent = 'Updated to ' + event.detail.value.toLocaleString(counter.locale || undefined) + '.';
    });
  </script>
</body>
</html>
