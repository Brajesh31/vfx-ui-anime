<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparkline Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,760px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.card{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px;border:1px solid #e8e4f6;border-radius:14px;margin:20px 0}button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#f0edff;font:inherit;font-weight:700;cursor:pointer}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>📈 Sparkline</h1><p>A compact trend indicator with an accessible summary and a live latest-value marker.</p>
<div class="card"><div><strong>Orders this week</strong><p>Daily order count</p></div><vfx-sparkline id="trend" label="Weekly orders" values="24,29,26,35,31,42,48"></vfx-sparkline></div>
<button id="update" type="button">Generate another series</button><p id="result" aria-live="polite">The trend is updated in place.</p><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>const trend=document.querySelector('#trend');document.querySelector('#update').addEventListener('click',()=>{trend.values=[18,20,19,17,25,28,30,34];trend.label='New period';document.querySelector('#result').textContent='A new data period is displayed.';});</script></body></html>
