<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Stepper</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%)}.stage{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:32px;border:1px solid #dcdaf0;border-radius:18px}#state{min-height:1.5em}</style><main><h1>Stepper</h1><p>A bounded quantity selector with keyboard controls and directional motion feedback.</p><section class="stage"><vfx-stepper label="Tickets" value="2" min="0" max="8"></vfx-stepper><vfx-stepper label="Items" value="4" min="1" max="20" step="2"></vfx-stepper></section><p id="state" aria-live="polite">Change a value.</p><p><a href="../../gallery/">← Back to gallery</a></p><script src="index.js"></script><script>document.querySelectorAll('vfx-stepper').forEach((x,i)=>x.addEventListener('change',e=>document.querySelector('#state').textContent='Control '+(i+1)+': '+e.detail.value));</script></main></html>
