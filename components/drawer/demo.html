<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX UI Anime Drawer</title><style>body{font:16px system-ui;margin:0;padding:40px;background:#f7f6ff;color:#1d1a4a}main{max-width:680px;margin:auto;background:white;padding:28px;border:2px solid #1d1a4a;border-radius:18px;box-shadow:8px 9px 0 #b8b3ff}p{color:#656080}</style><main><h1>Drawer</h1><p>Side panel with native modal dialog behavior</p><vfx-drawer title="Quick settings"><span slot="trigger">Open settings</span><p>Adjust your workspace preferences here.</p></vfx-drawer><p id="state" aria-live="polite">Try the component.</p></main><script src="index.js"></script><script>document.querySelector('vfx-drawer').addEventListener('change',e=>document.querySelector('#state').textContent=JSON.stringify(e.detail));document.querySelector('vfx-drawer').addEventListener('complete',e=>document.querySelector('#state').textContent='Complete: '+e.detail.value)</script></html>
