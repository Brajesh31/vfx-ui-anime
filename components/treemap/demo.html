<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treemap Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,840px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.stage{display:grid;place-items:center;padding:20px 0}button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#f0edff;font:inherit;font-weight:700;cursor:pointer}#result{min-height:1.5em;color:#625b91;font-size:13px}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>🧩 Treemap</h1><p>Tile area represents each category's share of the total. Select a tile to inspect its value.</p>
<div class="stage"><vfx-treemap id="map" title="Engineering resource allocation" items="frontend::Frontend::42|backend::Backend::30|platform::Platform::18|research::Research::10"></vfx-treemap></div>
<button id="update" type="button">Load revised allocation</button><p id="result" aria-live="polite">Choose a category to inspect it.</p><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>const map=document.querySelector('#map'),result=document.querySelector('#result');map.addEventListener('select',e=>{result.textContent=e.detail.label+': '+e.detail.value+' ('+e.detail.percent.toFixed(1)+'%)';});document.querySelector('#update').addEventListener('click',()=>{map.items=[{id:'design',label:'Design',value:24},{id:'delivery',label:'Delivery',value:56},{id:'operations',label:'Operations',value:20}];result.textContent='Revised allocation loaded.';});</script></body></html>
