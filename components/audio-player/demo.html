<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio Player | VFX UI Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.55 system-ui,sans-serif}
    main{width:min(100%,720px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}
    h1{margin:0;font-size:clamp(24px,4vw,34px)}p{color:#686381}vfx-audio-player{margin:22px auto}
    button{padding:9px 13px;border:2px solid #1d1a4a;border-radius:9px;background:#ffcae4;color:#1d1a4a;font:inherit;font-weight:800;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #6558d9;outline-offset:3px}a{color:#5146bd;font-weight:700}
  </style>
  <script src="index.js"></script>
</head>
<body>
  <main>
    <h1>🎧 Audio Player</h1>
    <p>Load a short sample tone synthesized locally by this page. No remote audio file or external service is used.</p>
    <button id="load-sample" type="button">Load 440 Hz sample</button>
    <vfx-audio-player id="sample-player" title="440 Hz sample tone" artist="Generated locally in your browser" preload="metadata"></vfx-audio-player>
    <p>After loading, use the component's play and seek controls. Playback still follows the browser's native audio and user-gesture policies.</p>
    <a href="../../gallery/">← Back to the component gallery</a>
  </main>
  <script>
    const player = document.querySelector('#sample-player');
    const loadButton = document.querySelector('#load-sample');
    let sampleUrl = '';

    function makeSampleWave() {
      const sampleRate = 8000;
      const sampleCount = sampleRate;
      const buffer = new ArrayBuffer(44 + sampleCount);
      const view = new DataView(buffer);
      const writeText = (offset, value) => {
        for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
      };
      writeText(0, 'RIFF');
      view.setUint32(4, 36 + sampleCount, true);
      writeText(8, 'WAVE');
      writeText(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      writeText(36, 'data');
      view.setUint32(40, sampleCount, true);
      for (let i = 0; i < sampleCount; i++) {
        const fade = Math.min(1, i / 160, (sampleCount - i) / 160);
        view.setUint8(44 + i, 128 + Math.round(42 * fade * Math.sin(2 * Math.PI * 440 * i / sampleRate)));
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    loadButton.addEventListener('click', () => {
      if (sampleUrl) URL.revokeObjectURL(sampleUrl);
      sampleUrl = URL.createObjectURL(makeSampleWave());
      player.src = sampleUrl;
      loadButton.textContent = 'Sample loaded';
      loadButton.disabled = true;
    });

    window.addEventListener('pagehide', () => {
      if (sampleUrl) URL.revokeObjectURL(sampleUrl);
    }, { once: true });
  </script>
</body>
</html>
