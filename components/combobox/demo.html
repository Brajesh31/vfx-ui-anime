<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Combobox</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%);min-height:410px}.stage{padding:32px;border:1px solid #dcdaf0;border-radius:18px}#state{min-height:1.5em;color:#8580b0}</style><main><h1>Combobox</h1><p>An editable option picker with filtering, roving keyboard selection and a spring snap on commit.</p><section class="stage"><vfx-combobox label="Framework" placeholder="Search frameworks"><option value="react">React</option><option value="vue">Vue</option><option value="svelte">Svelte</option><option value="solid">Solid</option><option value="angular">Angular</option><option value="preact" disabled>Preact, disabled</option></vfx-combobox><p id="state" aria-live="polite">Choose a framework.</p></section><p><a href="../../gallery/">← Back to gallery</a></p><script src="index.js"></script><script>document.querySelector('vfx-combobox').addEventListener('change',e=>document.querySelector('#state').textContent='Selected: '+e.detail.label);</script></main></html>
