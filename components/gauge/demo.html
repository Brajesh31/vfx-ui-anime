<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gauge Demo | VFX UI Anime</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f7f5ff;color:#1d1a4a;font:15px system-ui}main{width:min(100%,760px);margin:auto;padding:24px;border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}.stage{display:grid;place-items:center;padding:18px}label{display:block;margin:12px 0;font-weight:700}input{width:100%;accent-color:#7166d9}output{display:block;margin-top:8px;color:#625b91}a{color:#5548b7}</style>
<script src="index.js"></script></head>
<body><main><h1>🧭 Gauge</h1><p>A bounded meter with range-aware value clamping and accessible meter semantics.</p>
<div class="stage"><vfx-gauge id="gauge" label="Quality score" value="72" min="0" max="100"></vfx-gauge></div>
<label for="value">Set quality score <output id="out">72</output></label><input id="value" type="range" min="0" max="100" value="72"><p><a href="../../gallery/">← Back to gallery</a></p></main>
<script>const gauge=document.querySelector('#gauge'),input=document.querySelector('#value'),out=document.querySelector('#out');input.addEventListener('input',()=>{gauge.value=Number(input.value);out.value=input.value;});</script></body></html>
