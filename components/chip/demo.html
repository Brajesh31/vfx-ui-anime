<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Chip</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%)}.row{display:flex;gap:14px;flex-wrap:wrap;padding:30px;border:1px solid #dcdaf0;border-radius:18px}#state{min-height:1.5em}</style><main><h1>Chip</h1><p>Toggle filters or dismiss removable tokens.</p><section class="row"><vfx-chip selected>Anime</vfx-chip><vfx-chip>Motion</vfx-chip><vfx-chip removable label="Removable tag"></vfx-chip><vfx-chip disabled>Disabled</vfx-chip></section><p id="state" aria-live="polite">Select a chip or remove the removable tag.</p><p><a href="../../gallery/">← Back to gallery</a></p><script src="index.js"></script><script>document.querySelectorAll('vfx-chip').forEach(x=>{x.addEventListener('change',e=>document.querySelector('#state').textContent='Selected: '+e.detail.selected);x.addEventListener('remove',e=>document.querySelector('#state').textContent='Removed: '+e.detail.label)});</script></main></html>
