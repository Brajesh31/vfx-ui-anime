<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Context Menu</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(700px,100%)}.surface{display:grid;place-items:center;min-height:170px;border:2px dashed #8580b0;border-radius:18px;background:#faf9ff;font-weight:800;cursor:context-menu}</style><main><h1>Context Menu</h1><p>Right-click the surface or use Shift+F10 for a pointer-anchored action menu.</p><vfx-context-menu items="Open|Copy link|Rename|Duplicate|Archive|Delete"><div class="surface" tabindex="0">Right-click here</div></vfx-context-menu><p id="state" aria-live="polite">Choose an action.</p><a href="../../gallery/">← Back to gallery</a></main><script src="index.js"></script><script>document.querySelector('vfx-context-menu').addEventListener('select',e=>document.querySelector('#state').textContent='Action: '+e.detail.label);</script></html>
