<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Command Palette</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%)}.stage{display:grid;justify-items:center;gap:18px;padding:44px;border:1px solid #dcdaf0;border-radius:18px}button{padding:11px 16px;border:2px solid #1d1a4a;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}</style><main><h1>Command Palette</h1><p>A keyboard-first launcher with filterable commands and a full-screen impact entrance.</p><section class="stage"><button id="open">Open command palette</button><span>Or press Ctrl / ⌘ + K</span><vfx-command-palette commands="Create project|Open recent file|Search components|Toggle appearance|View shortcuts"></vfx-command-palette></section><p id="state" aria-live="polite">Choose a command.</p><a href="../../gallery/">← Back to gallery</a></main><script src="index.js"></script><script>document.querySelector('#open').onclick=()=>document.querySelector('vfx-command-palette').show();document.querySelector('vfx-command-palette').addEventListener('select',e=>document.querySelector('#state').textContent='Selected: '+e.detail.label);</script></html>
