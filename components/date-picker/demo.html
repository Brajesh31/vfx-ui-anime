<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX Date Picker</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#1d1a4a;font:15px system-ui}main{width:min(680px,100%);min-height:420px}.stage{padding:32px;border:1px solid #dcdaf0;border-radius:18px}#state{min-height:1.5em;color:#8580b0}</style><main><h1>Date Picker</h1><p>A fold-down calendar popover with date selection impact and month transitions.</p><section class="stage"><vfx-date-picker label="Launch date"></vfx-date-picker><p id="state" aria-live="polite">Open the picker and choose a date.</p></section><p><a href="../../gallery/">← Back to gallery</a></p><script src="index.js"></script><script>document.querySelector('vfx-date-picker').addEventListener('change',e=>document.querySelector('#state').textContent=e.detail.value);</script></main></html>
