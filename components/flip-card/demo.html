<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Flip Card | VFX UI Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ff;color:#1d1a4a;font:15px/1.55 system-ui,sans-serif}
    main{width:min(100%,760px);padding:clamp(18px,4vw,30px);border:3px solid #1d1a4a;border-radius:20px;background:#fff;box-shadow:9px 10px 0 #b8b3ff}
    h1{margin:0;font-size:clamp(24px,4vw,34px)}p{color:#686381}vfx-flip-card{margin:26px auto}
    a{color:#5146bd;font-weight:700}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px 0}
    button{padding:8px 12px;border:2px solid #1d1a4a;border-radius:8px;background:#ffcae4;color:#1d1a4a;font:inherit;font-weight:800;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #6558d9;outline-offset:3px}
  </style>
  <script src="index.js"></script>
</head>
<body>
  <main>
    <h1>🃏 3D Flip Card</h1>
    <p>Activate the card with a click, Enter, or Space. Its pressed state and accessible name describe the face that will be shown next.</p>
    <vfx-flip-card id="card" front="What is VFX UI Anime?" back="A dependency-free animated Web Component library."></vfx-flip-card>
    <div class="actions">
      <button id="front" type="button">Show front</button>
      <button id="back" type="button">Show back</button>
    </div>
    <a href="../../gallery/">← Back to the component gallery</a>
  </main>
  <script>
    const card = document.querySelector('#card');
    document.querySelector('#front').addEventListener('click', () => card.toggle(false));
    document.querySelector('#back').addEventListener('click', () => card.toggle(true));
  </script>
</body>
</html>
