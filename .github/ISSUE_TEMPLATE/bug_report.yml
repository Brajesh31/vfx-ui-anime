name: 🐛 Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and expected behavior.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: vfx-button
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
    validations:
      required: false
