name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate original component set and generated files
        run: |
          npm test
          npm run check
      - name: Start local gallery server
        run: |
          python3 -m http.server 8000 >/tmp/vfx-ui-anime-http.log 2>&1 &
          sleep 2
      - name: Run touch, keyboard, and form interaction tests
        run: npm run test:browser
      - name: Pack, install, and smoke-test the npm package
        run: npm run test:package
