name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate repository and components
        run: |
          npm test
          npm run check

      - name: Run headless Chromium interaction tests
        run: npm run test:browser

      - name: Install temporary Playwright browser tooling
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps firefox webkit

      - name: Run Firefox and WebKit interaction tests
        run: npm run test:cross-browser
