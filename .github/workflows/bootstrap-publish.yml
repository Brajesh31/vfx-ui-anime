name: Bootstrap first npm publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: First stable package version to publish
        required: true
        type: choice
        options:
          - "0.1.0"

permissions:
  contents: write

concurrency:
  group: npm-bootstrap-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap public vfx-ui-anime package
    if: github.ref == 'refs/heads/main' && inputs.version == '0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm bootstrap authorization
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Missing repository Actions secret NPM_TOKEN. Add an npm granular publish token with package publish permission, then rerun this workflow."
            exit 1
          fi

      - name: Verify stable package version and release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Input version $RELEASE_VERSION does not match package.json $PACKAGE_VERSION."
            exit 1
          fi
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists. Refusing to bootstrap a second time."
            exit 1
          fi
          if npm view "vfx-ui-anime" name >/dev/null 2>&1; then
            echo "The npm package name vfx-ui-anime already exists. Refusing to bootstrap or overwrite it."
            echo "Confirm package ownership. If you own it, configure npm Trusted Publisher and use the OIDC publish workflow."
            exit 1
          fi

      - name: Run structural and source checks
        run: |
          npm test
          npm run check

      - name: Start gallery server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/vfx-ui-anime-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/gallery/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vfx-ui-anime-http.log
          exit 1

      - name: Run complete Chromium component suite
        run: npm run test:browser

      - name: Test packed package in a clean consumer
        run: npm run test:package

      - name: Bootstrap first public npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create the stable GitHub release and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # VFX UI Anime v${RELEASE_VERSION}

          The first public npm package release.

          ## Install

          ```bash
          npm install vfx-ui-anime
          ```

          ## Import all components

          ```js
          import 'vfx-ui-anime';
          ```

          ## Import one component

          ```js
          import 'vfx-ui-anime/button';
          ```

          This is a browser-only Web Components package containing 82 custom elements. It does not provide React/Vue wrappers or named component classes.

          The tagged source passed repository validation, the full Chromium interaction suite, and the package tarball/consumer smoke test on commit $RELEASE_SHA.

          Screen-reader, real-device touch, Firefox and Safari manual certification remain separate QA tasks.
          EOF
          gh release create "v${RELEASE_VERSION}" \
            --target "$RELEASE_SHA" \
            --title "VFX UI Anime v${RELEASE_VERSION}" \
            --notes-file release-notes.md
