name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish vfx-ui-anime
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag, main ancestry and toolchain
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "Pre-release tags cannot publish to the stable npm channel."
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node --version
          npm --version
          node -e "const [major,minor]=process.versions.node.split('.').map(Number); if(major<22 || (major===22 && minor<14)) process.exit(1)"
          npm --version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const [a,b,c]=s.trim().split('.').map(Number);if(a<11||(a===11&&b<5)||(a===11&&b===5&&c<1)){console.error('npm 11.5.1 or newer is required');process.exit(1)}})"

      - name: Run structural and source checks
        run: |
          npm test
          npm run check

      - name: Start gallery server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/vfx-ui-anime-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/gallery/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vfx-ui-anime-http.log
          exit 1

      - name: Run complete Chromium component suite
        run: npm run test:browser

      - name: Test packed package in a clean consumer
        run: npm run test:package

      - name: Reuse an already published version
        id: registry
        env:
          PACKAGE_NAME: vfx-ui-anime
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${PACKAGE_VERSION#v}"
          for attempt in $(seq 1 18); do
            if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "already-published=true" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_NAME@$VERSION is already in the registry. No duplicate publish will be attempted."
              exit 0
            fi
            sleep 5
          done
          echo "already-published=false" >> "$GITHUB_OUTPUT"

      - name: Publish with npm trusted publishing and provenance
        if: steps.registry.outputs.already-published != 'true'
        run: npm publish --provenance
