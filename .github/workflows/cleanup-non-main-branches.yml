name: Keep only main branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-non-main-branches.yml"

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    name: Delete every non-main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify main is the default branch and delete all other branches
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          if [[ "$default_branch" != "main" ]]; then
            echo "Refusing cleanup: expected default branch main, found $default_branch."
            exit 1
          fi

          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')

          if ! printf '%s\n' "\${branches[@]}" | grep -Fxq "main"; then
            echo "Refusing cleanup: main was not returned by the branch API."
            exit 1
          fi

          for branch in "\${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "Keeping default branch: main"
              continue
            fi

            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done

          mapfile -t remaining < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')

          if [[ "\${#remaining[@]}" -ne 1 || "\${remaining[0]}" != "main" ]]; then
            printf 'Unexpected remaining branches:\n%s\n' "\${remaining[@]}"
            exit 1
          fi

          echo "Verified: main is the only remaining branch."
          {
            echo "## Branch cleanup complete"
            echo ""
            echo "Deleted every non-main branch. Verified that \`main\` is the only branch remaining."
          } >> "$GITHUB_STEP_SUMMARY"
