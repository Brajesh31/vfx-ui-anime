name: Publish GitHub Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: github-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish scoped GitHub npm package
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: "@brajesh31/vfx-ui-anime"
      REGISTRY: "https://npm.pkg.github.com/"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@brajesh31"
          package-manager-cache: false

      - name: Verify release version
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$EVENT_NAME" == "push" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $VERSION."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release versions cannot be published to the stable GitHub Packages channel."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "GitHub Packages target: $PACKAGE_NAME@$VERSION"

      - name: Run source and browser verification
        run: |
          set -euo pipefail
          npm test
          npm run check
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/vfx-ui-anime-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/gallery/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              cat /tmp/vfx-ui-anime-http.log
              exit 1
            fi
            sleep 1
          done
          npm run test:browser
          npm run test:package

      - name: Check whether this GitHub Package version already exists
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" version --registry="$REGISTRY" >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$VERSION already exists on GitHub Packages. No duplicate publish attempted."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a scoped GitHub Packages copy of the verified npm tarball
        if: steps.registry.outputs.already-published != 'true'
        id: pack
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/github-package" "$RUNNER_TEMP/scoped-package"
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP/github-package")"
          tar -xzf "$RUNNER_TEMP/github-package/$TARBALL" -C "$RUNNER_TEMP/scoped-package"
          node --input-type=module - "$RUNNER_TEMP/scoped-package/package/package.json" "$REGISTRY" "$PACKAGE_NAME" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const [file, registry, name] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          if (manifest.version !== process.env.VERSION) throw new Error('Packed package version mismatch.');
          manifest.name = name;
          manifest.repository = { type: 'git', url: 'https://github.com/Brajesh31/vfx-ui-anime.git' };
          manifest.publishConfig = { registry };
          writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node -e "const p=require(process.argv[1]);if(p.name!=='@brajesh31/vfx-ui-anime'||p.version!==process.env.VERSION)process.exit(1)" "$RUNNER_TEMP/scoped-package/package/package.json"

      - name: Publish scoped package with GITHUB_TOKEN
        if: steps.registry.outputs.already-published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm publish "$RUNNER_TEMP/scoped-package/package" --ignore-scripts --registry="$REGISTRY"
          {
            echo "## GitHub Package published"
            echo ""
            echo "Published $PACKAGE_NAME@${{ steps.package.outputs.version }} to $REGISTRY using the repository-scoped GITHUB_TOKEN."
            echo ""
            echo "The existing unscoped npmjs package vfx-ui-anime was not renamed or modified."
            echo ""
            echo "GitHub's first-publish default visibility is private. Review the package settings and change visibility to Public if public GitHub Packages access is intended."
            echo ""
            echo "The repository field links this package to $GITHUB_REPOSITORY."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record already-published package
        if: steps.registry.outputs.already-published == 'true'
        run: |
          {
            echo "## GitHub Package already exists"
            echo ""
            echo "$PACKAGE_NAME@${{ steps.package.outputs.version }} is already published. No duplicate publish was attempted."
          } >> "$GITHUB_STEP_SUMMARY"
