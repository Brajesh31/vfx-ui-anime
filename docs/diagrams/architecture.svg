<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">VFX UI Anime architecture</title><desc id="d">Host page loads core and components. Components use native controls and shared effects API, which draws to a canvas.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#6557d9"/></marker></defs><rect width="1000" height="560" rx="24" fill="#f7f5ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#6557d9" stroke-width="3"><rect x="340" y="35" width="320" height="70" rx="14"/><rect x="100" y="190" width="300" height="85" rx="14"/><rect x="600" y="190" width="300" height="85" rx="14"/><rect x="340" y="390" width="320" height="85" rx="14"/></g><g fill="#211b43" font-size="22" font-weight="700"><text x="500" y="78">Host HTML page</text><text x="250" y="225">core.js</text><text x="250" y="253" font-size="16">Shared API + motion engine</text><text x="750" y="225">Component scripts</text><text x="750" y="253" font-size="16">11 custom elements</text><text x="500" y="427">Shared canvas</text><text x="500" y="455" font-size="16">Decorative particle effects</text></g><g stroke="#6557d9" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M430 105 300 190"/><path d="M570 105 700 190"/><path d="M400 232 600 232"/><path d="M250 275 400 390"/><path d="M750 275 600 390"/></g></g></svg>