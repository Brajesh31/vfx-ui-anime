<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">VFX UI Anime motion principles storyboard</title>
<desc id="desc">Five-stage motion storyboard from rest through anticipation, impact, follow-through and settle, with notes about control state and reduced motion.</desc>
<rect width="1600" height="720" rx="28" fill="#FFFDFB"/>
<g font-family="Inter, ui-sans-serif, Arial, sans-serif" fill="#211B43">
  <text x="70" y="76" font-size="18" font-weight="800" letter-spacing="3" fill="#6557D9">VFX UI ANIME / MOTION SYSTEM</text>
  <text x="70" y="142" font-size="58" font-weight="900" letter-spacing="-3">Five beats. One clear action.</text>
  <text x="74" y="184" font-size="21" fill="#77718E">Decorative motion follows the state change. It never replaces it.</text>
  <g transform="translate(70 240)">
    <g>
      <rect width="250" height="260" rx="20" fill="#FFFFFF" stroke="#E6E2F5" stroke-width="2"/>
      <text x="24" y="42" font-size="16" font-weight="900" fill="#6557D9">01 / REST</text>
      <rect x="54" y="108" width="142" height="56" rx="14" fill="#6557D9" stroke="#211B43" stroke-width="4"/>
      <text x="125" y="143" font-size="18" text-anchor="middle" font-weight="800" fill="#FFFFFF">Ready</text>
      <text x="24" y="210" font-size="16" font-weight="700">Stable and quiet</text>
      <text x="24" y="236" font-size="14" fill="#77718E">No idle motion required</text>
    </g>
    <path d="M264 130h38m-12-12 12 12-12 12" fill="none" stroke="#AAA5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(320 0)">
      <rect width="250" height="260" rx="20" fill="#FFFFFF" stroke="#E6E2F5" stroke-width="2"/>
      <text x="24" y="42" font-size="16" font-weight="900" fill="#6557D9">02 / ANTICIPATION</text>
      <rect x="56" y="119" width="138" height="40" rx="12" fill="#6557D9" stroke="#211B43" stroke-width="4"/>
      <path d="M45 176h25m-14-10-11 10 11 10M206 176h-25m14-10 11 10-11 10" fill="none" stroke="#FF5F9E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="210" font-size="16" font-weight="700">Prepare the action</text>
      <text x="24" y="236" font-size="14" fill="#77718E">Small squash or direction</text>
    </g>
    <path d="M584 130h38m-12-12 12 12-12 12" fill="none" stroke="#AAA5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(640 0)">
      <rect width="250" height="260" rx="20" fill="#FFFFFF" stroke="#E6E2F5" stroke-width="2"/>
      <text x="24" y="42" font-size="16" font-weight="900" fill="#6557D9">03 / IMPACT</text>
      <path d="M126 72 145 117 194 98 165 137 210 162 157 157 127 207 111 158 57 164 94 136 67 98 112 117Z" fill="#AAA5FF" stroke="#211B43" stroke-width="4" stroke-linejoin="round"/>
      <path d="M126 91 139 128 177 117 153 143 179 160 145 156 126 189 113 155 78 160 102 139 83 117 115 129Z" fill="#FF5F9E" stroke="#211B43" stroke-width="3" stroke-linejoin="round"/>
      <text x="24" y="226" font-size="16" font-weight="700">Make it decisive</text>
      <text x="24" y="250" font-size="14" fill="#77718E">One primary accent</text>
    </g>
    <path d="M904 130h38m-12-12 12 12-12 12" fill="none" stroke="#AAA5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(960 0)">
      <rect width="250" height="260" rx="20" fill="#FFFFFF" stroke="#E6E2F5" stroke-width="2"/>
      <text x="24" y="42" font-size="16" font-weight="900" fill="#6557D9">04 / FOLLOW-THROUGH</text>
      <path d="M105 124 124 96 135 124 165 111 151 139 176 158 145 153 126 183 116 153 84 159 103 137Z" fill="#AAA5FF" stroke="#211B43" stroke-width="4" stroke-linejoin="round"/>
      <path d="M80 97 34 79M76 130 25 138M171 89 215 66M176 180 222 197" fill="none" stroke="#6557D9" stroke-width="5" stroke-linecap="round"/>
      <circle cx="55" cy="187" r="6" fill="#FF5F9E"/><circle cx="205" cy="118" r="5" fill="#FF5F9E"/>
      <text x="24" y="226" font-size="16" font-weight="700">Carry the energy</text>
      <text x="24" y="250" font-size="14" fill="#77718E">Few particles, then exit</text>
    </g>
    <path d="M1224 130h38m-12-12 12 12-12 12" fill="none" stroke="#AAA5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1280 0)">
      <rect width="180" height="260" rx="20" fill="#FFFFFF" stroke="#E6E2F5" stroke-width="2"/>
      <text x="20" y="42" font-size="16" font-weight="900" fill="#6557D9">05 / SETTLE</text>
      <rect x="28" y="113" width="124" height="50" rx="12" fill="#6557D9" stroke="#211B43" stroke-width="4"/>
      <text x="90" y="144" font-size="16" text-anchor="middle" font-weight="800" fill="#FFFFFF">Done</text>
      <path d="M136 95l9 9 18-24" fill="none" stroke="#FF5F9E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="226" font-size="16" font-weight="700">Return to clarity</text>
      <text x="20" y="250" font-size="14" fill="#77718E">Stable final state</text>
    </g>
  </g>
  <g transform="translate(70 550)">
    <rect width="1460" height="108" rx="18" fill="#F3F0FF"/>
    <text x="28" y="42" font-size="17" font-weight="900">REDUCED-MOTION RULE</text>
    <text x="28" y="76" font-size="17">Keep the state change and essential feedback. Suppress large travel, repeated particles, and nonessential loops.</text>
    <rect x="1160" y="26" width="260" height="56" rx="14" fill="#211B43"/>
    <text x="1290" y="61" font-size="16" text-anchor="middle" font-weight="800" fill="#FFFFFF">Clarity over spectacle</text>
  </g>
</g>
</svg>