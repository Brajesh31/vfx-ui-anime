<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX UI Anime basic integration</title><link rel="stylesheet" href="../styles.css"><script defer src="../core.js"></script><script defer src="../components/button/index.js"></script><script defer src="../components/toggle/index.js"></script></head>
<body><main class="wrap"><p class="eyebrow">Integration example</p><h1>Use the controls</h1><p>Load the shared engine once, then load only the components your page needs.</p><vfx-button id="action">Run action</vfx-button><vfx-toggle label="Enable notifications"></vfx-toggle><p id="status" aria-live="polite"></p></main><script>document.addEventListener("DOMContentLoaded",()=>document.querySelector("#action")?.addEventListener("vfx-activate",()=>document.querySelector("#status").textContent="Action activated."));</script></body></html>
